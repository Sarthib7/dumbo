name: Dumbo
options:
  bundleIdPrefix: com.sarthib7
  deploymentTarget:
    iOS: "16.2"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "${APPLE_TEAM_ID}"
    # Set to "-nost" to sign without Family Controls (TestFlight before Apple approves distribution).
    DUMBO_ENT_SUFFIX: ""
    # "-bare" signs the widgets without the App Group.
    DUMBO_WIDGETS_ENT_SUFFIX: ""
    CODE_SIGN_STYLE: Automatic
    # Manual (App Store) signing uses the profiles created by scripts/asc_profiles.py.
    PROVISIONING_PROFILE_SPECIFIER: "$(DUMBO_PROFILE_$(CODE_SIGN_STYLE))"
    DUMBO_PROFILE_Automatic: ""
    DUMBO_PROFILE_Manual: "Dumbo AppStore $(PRODUCT_BUNDLE_IDENTIFIER)"
    TARGETED_DEVICE_FAMILY: "1"
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-Osize"
      SWIFT_COMPILATION_MODE: wholemodule
      DEAD_CODE_STRIPPING: YES
      STRIP_INSTALLED_PRODUCT: YES
packages:
  DumboKit:
    path: Packages/DumboKit
targets:
  Dumbo:
    type: application
    platform: iOS
    sources:
      - Dumbo
      - Shared
    dependencies:
      - package: DumboKit
      - target: DumboWidgets
      - target: DumboMonitor
    info:
      path: Dumbo/Info.plist
      properties:
        CFBundleDisplayName: Dumbo
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.sarthib7.dumbo
            CFBundleURLSchemes: [dumbo]
        NSSupportsLiveActivities: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sarthib7.dumbo
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Dumbo/Dumbo$(DUMBO_ENT_SUFFIX).entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  DumboWidgets:
    type: app-extension
    platform: iOS
    sources:
      - DumboWidgets
      - Shared
    dependencies:
      - package: DumboKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: DumboWidgets/Info.plist
      properties:
        CFBundleDisplayName: Dumbo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sarthib7.dumbo.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: DumboWidgets/DumboWidgets$(DUMBO_WIDGETS_ENT_SUFFIX).entitlements
  DumboMonitor:
    type: app-extension
    platform: iOS
    sources:
      - DumboMonitor
    dependencies:
      - package: DumboKit
    info:
      path: DumboMonitor/Info.plist
      properties:
        CFBundleDisplayName: DumboMonitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DumboMonitorExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sarthib7.dumbo.monitor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: DumboMonitor/DumboMonitor$(DUMBO_ENT_SUFFIX).entitlements
schemes:
  Dumbo:
    build:
      targets:
        Dumbo: all
    run:
      config: Debug
